name: Feature request
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
body:
  - type: input
    id: repository
    attributes:
      label: Repository or product
      description: Name the intended repository or product surface.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user or operator outcome rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the current limitation and who it affects.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: State how the finished work can be proven.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Note compatibility, privacy, security, rollout, or operational boundaries.
  - type: checkboxes
    id: checks
    attributes:
      label: Requester checks
      options:
        - label: I searched existing issues and pull requests for similar work.
          required: true
        - label: I did not include credentials, private data, or sensitive infrastructure details.
          required: true
